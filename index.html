function say(s){toast(s);if(db.settings.voiceReply&&'speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='en-GB';u.rate=1;speechSynthesis.speak(u)}}
const btn=(label,fn,cl='secondary')=>`<button class="${cl}" onclick="${fn}">${label}</button>`;
function render(){document.getElementById('tank-total').textContent=db.tanks.length+' tanks';document.getElementById('nav').innerHTML=[['dashboard','📊 Dashboard'],['tanks','🏠 Tanks'],['stock','💷 Stock Value'],['breeding','🥚 Breeding'],['tests','🧪 Water tests'],['maintenance','🧽 Maintenance'],['equipment','🔧 Equipment'],['layout','🗺️ 2D Layout'],['commands','🎙️ Commands'],['settings','⚙️ Settings']].map(([k,n])=>`<button class="${tab===k?'active':''}" onclick="go('${k}')">${n}</button>`).join('');const v=document.getElementById('view');v.innerHTML=selected!==null&&tab==='tanks'?tankDetail():({dashboard:renderDashboard,tanks:renderTanks,stock:renderStock,breeding:renderBreeding,tests:renderTests,maintenance:renderMaintenance,equipment:renderEquipment,layout:renderLayout,commands:renderCommands,settings:renderSettings}[tab]());}
function go(t){tab=t;selected=null;render()};function openTank(id){selected=id;render()}
function saleCount(name){return db.tanks.reduce((sum,t)=>sum+(Number(t.saleCounts?.[name])||0),0)}
function renderStock(){let total=db.stockItems.reduce((a,x)=>a+saleCount(x.name)*(Number(x.price)||0),0);return `<div class="panel"><h2>💷 Fish Prices & Stock Value</h2><p class="hint">Only trade prices can be edited here. Quantities come from the saleable fish counts in each tank, excluding breeding pairs and other fish not for sale.</p><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr><th style="text-align:left;padding:9px 4px">Fish</th><th>Quantity / tanks</th><th>Each (£)</th><th style="text-align:right">Total</th></tr></thead><tbody>${db.stockItems.map((x,i)=>`<tr style="border-top:1px solid #d5e5ea"><td style="padding:10px 4px">${esc(x.name)}</td><td style="text-align:center">${saleCount(x.name)}<div class="hint" style="font-size:11px">${db.tanks.filter(t=>Number(t.saleCounts?.[x.name])>0).map(t=>`Tank ${t.id}: ${t.saleCounts[x.name]}`).join(" · ")||"—"}</div></td><td><input aria-label="Price of ${esc(x.name)}" type="number" min="0" step="0.01" style="min-width:72px;width:82px;padding:8px" value="${Number(x.price)||0}" onchange="changeStockPrice(${i},this.value)"></td><td style="text-align:right;white-space:nowrap">£${(saleCount(x.name)*(Number(x.price)||0)).toFixed(2)}</td></tr>`).join('')}</tbody></table></div><div class="row" style="margin-top:20px;border-top:2px solid #d5e5ea;padding-top:16px"><strong>Total Stock Value</strong><strong style="font-size:23px;color:#117f93">£${total.toFixed(2)}</strong></div><p class="hint">To change quantities, open the relevant tank and update its Saleable Stock Counts. The total updates automatically. Counts from old free-text notes cannot be imported reliably, so please enter them once in each tank.</p></div>`}
function changeStockPrice(i,value){let x=db.stockItems[i];if(!x)return;let n=Number(value);if(!Number.isFinite(n)||n<0){toast('Enter a valid price.');render();return}x.price=Math.round(n*100)/100;save();render()}
function saleCountEditor(t){return `<div class="panel" style="margin-top:12px"><h3>🐟 Saleable stock counts</h3><p class="hint">Enter fish and shrimp available for sale in this tank. Do not include breeding pairs. Use zero for species not in this tank. These numbers feed the Stock Value tab automatically.</p><div class="grid">${db.stockItems.map(x=>`<div><label>${esc(x.name)}</label><input type="number" min="0" step="1" data-sale-species="${esc(x.name)}" value="${Number(t.saleCounts?.[x.name])||0}"></div>`).join('')}</div><div class="actions"><button class="action" onclick="saveSaleCounts()">Save stock counts</button><button class="secondary" onclick="addSpecies()">+ Add species</button><button class="secondary" onclick="deleteSpecies()">Delete species</button></div></div>`}
function addSpecies(){let name=prompt('New fish or shrimp species name:');if(name===null)return;name=name.trim().replace(/\s+/g,' ');if(!name){toast('Enter a species name.');return}if(name.length>70){toast('Species name is too long.');return}if(db.stockItems.some(x=>x.name.toLowerCase()===name.toLowerCase())){toast('That species is already listed.');return}db.stockItems.push({name,price:0,qty:0});save();render();toast(name+' added. Set its trade price on Stock Value.');}
function deleteSpecies(){let name=prompt('Exact species name to delete from the stock list:');if(!name)return;let i=db.stockItems.findIndex(x=>x.name.toLowerCase()===name.trim().toLowerCase());if(i<0){toast('Species not found');return}if(!confirm('Delete '+db.stockItems[i].name+' and its stock counts from ALL tanks? This cannot be undone. Export a backup first.'))return;db.stockItems.splice(i,1);db.tanks.forEach(t=>delete t.saleCounts?.[name]);save();render();toast('Species deleted')}
function saveSaleCounts(){let t=db.tanks.find(x=>x.id===selected),counts={};for(let el of document.querySelectorAll('[data-sale-species]')){let n=Number(el.value);if(!Number.isInteger(n)||n<0){toast('Use whole numbers of zero or more.');return}if(n)counts[el.dataset.saleSpecies]=n;}t.saleCounts=counts;save();render();toast('Stock counts saved and valuation updated.');}
function renderTanks(){let active=db.tanks.filter(t=>t.status==='active').length,planned=db.tanks.filter(t=>t.status==='planned').length;let tiles=db.tanks.map(t=>`<button class="tank" onclick="openTank(${t.id})"><div class="tankhead"><span class="num">Tank ${t.id}</span><span class="tag ${t.status==='planned'?'off':t.status==='empty'?'warn':''}">${t.status==='planned'?'Planned':t.status==='empty'?'Empty':'In use'}</span></div><h3>${esc(t.name)}</h3><div class="sub">${esc(t.litres?t.litres+' litres':'Size not entered')}</div><div class="tank-water ${t.status==='active'?'':t.status==='empty'?'empty-water':'planned-water'}"></div><p>${esc(Object.entries(t.saleCounts||{}).filter(([k,v])=>Number(v)>0).map(([k,v])=>v+" × "+k).join(", ")||"No saleable fish counts entered")}</p></button>`);return `<div class="metrics"><div class="metric"><b>${db.tanks.length}</b><span>Total tanks</span></div><div class="metric"><b>${active}</b><span>In use</span></div><div class="metric"><b>${planned}</b><span>Not set up</span></div></div>${wcOverview()}<div class="overview-head"><h2>Your tanks</h2>${btn("+ Add tank","addTank()","action")}<p class="hint">Tap any tank to see or update its records. Grouped by tank number, not physical position.</p></div>${Array.from({length:Math.ceil(tiles.length/6)},(_,j)=>j*6).map((i,j)=>`<div class="rack-label">Tanks ${i+1}–${Math.min(i+6,db.tanks.length)}</div><div class="rack"><div class="tank-grid">${tiles.slice(i,i+6).join('')}</div><div class="rack-foot"></div></div>`).join('')}`}
function addTank(){let id=Math.max(0,...db.tanks.map(t=>t.id))+1;let name=prompt('Name or purpose for new Tank '+id,'Empty');if(name===null)return;db.tanks.push({id,name:name||'Empty',dimensions:'',litres:null,status:'empty',notes:'',saleCounts:{}});save();go('tanks');openTank(id)}
function deleteTank(id){let t=db.tanks.find(t=>t.id===id);if(!t)return;if(!confirm('Delete Tank '+id+'? Its maintenance, breeding, and test records will also be deleted. Export a backup first.'))return;if(!confirm('Confirm permanent deletion of Tank '+id+' and its records?'))return;db.tanks=db.tanks.filter(t=>t.id!==id);for(let k of ['tests','breeding','maintenance'])db[k]=db[k].filter(x=>+x.tank!==id);db.layout?.placements&&delete db.layout.placements[id];save();go('tanks')}
function tankDetail(){let t=db.tanks.find(x=>x.id===selected);return `<button class="back" onclick="selected=null;render()">← All tanks</button><div class="panel"><h2>Tank ${t.id} — ${esc(t.name)}</h2><div class="sub">${esc(t.dimensions||'Dimensions unknown')} ${t.litres?' • '+t.litres+' L gross':''}</div><label>Name / purpose</label><input id="tn" value="${esc(t.name)}"><label>Dimensions (mm)</label><input id="td" value="${esc(t.dimensions)}" placeholder="e.g. 300 × 300 × 300"><label>Gross litres (automatically calculated from dimensions)</label><input id="tl" type="number" readonly step="0.1" value="${t.litres??''}"><label>Status</label><select id="ts"><option value="active" ${t.status==='active'?'selected':''}>In use</option><option value="empty" ${t.status==='empty'?'selected':''}>Empty / set up</option><option value="planned" ${t.status==='planned'?'selected':''}>Not set up</option></select><label>Notes</label><textarea id="tno">${esc(t.notes)}</textarea><div class="actions">${btn('Save tank changes','saveTank()','action')}${btn('Add water test',`addForm('tests',${t.id})`)}${btn('Record breeding',`addForm('breeding',${t.id})`)}${btn('Delete tank',`deleteTank(${t.id})`)}</div></div>${saleCountEditor(t)}<div class="panel" style="margin-top:12px"><h3>Tank history</h3>${[...db.tests.filter(x=>+x.tank===t.id).map(x=>({...x,_type:'Water test'})),...db.breeding.filter(x=>+x.tank===t.id).map(x=>({...x,_type:'Breeding'})),...db.maintenance.filter(x=>+x.tank===t.id).map(x=>({...x,_type:'Maintenance'}))].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="listrow"><b>${esc(x._type)}</b> <span class="muted small">${esc(x.date||'Date unknown')}</span><div class="hint">${esc(x.type||x.action||[x.ammonia!==''?'Ammonia '+x.ammonia:'',x.nitrite!==''?'Nitrite '+x.nitrite:'',x.nitrate!==''?'Nitrate '+x.nitrate:''].filter(Boolean).join(' • '))} ${esc(x.notes)}</div></div>`).join('')||'<p class="empty">No records yet.</p>'}</div>`}
function tankDims(t){const nums=String(t.dimensions||'').match(/\d+(?:\.\d+)?/g);return nums&&nums.length>=3?nums.slice(0,3).map(Number):null}
function syncTankFromFields(t,oldDims){const dims=tankDims(t);if(!dims)return;let [length,depth,height]=dims;if(!(length>0&&depth>0&&height>0))return;t.litres=Math.round(length*depth*height/1000000*10)/10;ensureLayout();let a=positionFor(t);let baseline=db.layout.scale?.[t.id];if(!baseline){baseline={length:oldDims?.[0]||length,height:oldDims?.[2]||height,w:a.w,h:a.h||21};db.layout.scale??={};db.layout.scale[t.id]=baseline;}let w=Math.min(98,Math.max(5,baseline.w*length/baseline.length));let h=Math.min(75,Math.max(8,baseline.h*height/baseline.height));db.layout.placements[t.id]={...a,w:Math.min(w,100-a.x),h:Math.min(h,100-a.y)};}
function resizeTankFromLayout(t,w,h){ensureLayout();let dims=tankDims(t);if(!dims){toast('Enter this tank’s real length, depth and height on its Tanks page first.');return false;}let a=positionFor(t);let base=db.layout.scale?.[t.id];if(!base){base={length:dims[0],height:dims[2],w:a.w,h:a.h||21};db.layout.scale??={};db.layout.scale[t.id]=base;}let length=Math.max(1,Math.round(base.length*w/base.w)),height=Math.max(1,Math.round(base.height*h/base.h));t.dimensions=`${length} × ${dims[1]} × ${height}`;t.litres=Math.round(length*dims[1]*height/1000000*10)/10;db.layout.placements[t.id]={...a,w,h};return true;}
function saveTank(){let t=db.tanks.find(x=>x.id===selected);t.name=document.getElementById('tn').value;let oldDims=tankDims(t);t.dimensions=document.getElementById('td').value;t.litres=document.getElementById('tl').value===''?null:+document.getElementById('tl').value;syncTankFromFields(t,oldDims);if(db.layout?.wholeGroups){let group=db.layout.wholeGroups.find(g=>g.ids.includes(t.id));if(group){let now=tankDims(t);if(now&&oldDims){group.w=Math.max(10,Math.min(98-group.x,group.w+(now[0]-oldDims[0])*0.075));group.h=Math.max(9,Math.min(95-group.y,group.h*now[2]/oldDims[2]));}}}t.status=document.getElementById('ts').value;t.notes=document.getElementById('tno').value;save();render();say('Tank '+t.id+' saved.')}
function recordList(items,label){return items.map((x,i)=>({...x,_index:i})).sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(x=>`<div class="listrow"><div class="row"><b>Tank ${esc(x.tank)} • ${esc(x.type||x.action||label)}</b><span class="muted small">${esc(x.date||'Unknown date')}</span></div><div class="hint">${label==='Test'?`Ammonia ${esc(x.ammonia||'—')} • Nitrite ${esc(x.nitrite||'—')} • Nitrate ${esc(x.nitrate||'—')} • pH ${esc(x.ph||'—')} • High pH ${esc(x.highph||'—')}`:''} ${esc(x.notes||'')}</div>${btn("Delete",`deleteRecord('${label}',${x._index})`)}</div>`).join('')||'<div class="empty">No entries yet.</div>'}
function deleteRecord(label,i){let key={Breeding:'breeding',Test:'tests',Maintenance:'maintenance'}[label];if(!key||!db[key][i])return;if(!confirm('Delete this '+label.toLowerCase()+' record permanently?'))return;db[key].splice(i,1);save();render()}
function renderBreeding(){return `<div class="panel"><div class="row"><h2>Breeding history</h2>${btn('+ Record','addForm(\'breeding\')','action')}</div><p class="hint">Dates left blank when uncertain. Link parents and offspring in notes.</p>${fryAgePanel()}${breedingStats()}${recordList(db.breeding,'Breeding')}</div>`}
function renderTests(){return `<div class="panel"><div class="row"><h2>Water tests</h2>${btn('+ Add test','addForm(\'tests\')','action')}</div><p class="hint">API Freshwater Master Test Kit readings in ppm, except pH. For ammonia and nitrite, aim for 0 ppm; regularly monitor nitrate.</p>${waterWarnings()}${recordList(db.tests,'Test')}</div>`}

function wcDays(id){const n=Number(db.settings?.waterChangeDays?.[id]);return Number.isInteger(n)&&n>=1&&n<=365?n:7}
function wcLast(id){return db.maintenance.filter(x=>Number(x.tank)===Number(id)&&String(x.action||'').trim().toLowerCase()==='water change'&&/^\d{4}-\d{2}-\d{2}$/.test(x.date||'')).map(x=>x.date).sort().pop()||null}
function wcNext(id){const d=wcLast(id);if(!d)return null;const dt=new Date(d+'T12:00:00Z');dt.setUTCDate(dt.getUTCDate()+wcDays(id));return dt.toISOString().slice(0,10)}
function wcState(id){const d=wcNext(id);if(!d)return 'No water change recorded';const diff=Math.round((Date.parse(d+'T12:00:00Z')-Date.parse(today()+'T12:00:00Z'))/86400000);return diff<0?'Overdue by '+(-diff)+' day(s) — '+d:diff===0?'Due today — '+d:diff<=2?'Due soon — '+d:'Next due: '+d}
function wcSave(id){const el=document.getElementById('wc_days_'+id);const n=Number(el.value);if(!Number.isInteger(n)||n<1||n>365){toast('Enter 1 to 365 whole days');return}db.settings??={};db.settings.waterChangeDays??={};db.settings.waterChangeDays[id]=n;save();render();toast('Tank '+id+' schedule saved')}
function wcOverview(){const active=db.tanks.filter(t=>t.status==='active');const due=active.filter(t=>wcNext(t.id)&&wcNext(t.id)<=today());const soon=active.filter(t=>{const d=wcNext(t.id);return d&&d>today()&&(Date.parse(d+'T12:00:00Z')-Date.parse(today()+'T12:00:00Z'))/86400000<=2});const missing=active.filter(t=>!wcNext(t.id));return `<div class="panel"><div class="row"><h2>💧 Water change reminders</h2>${btn('Change schedules',"go('maintenance')")}</div><p class="hint">${due.length} due/overdue • ${soon.length} due soon • ${missing.length} without a recorded change</p>${[...due,...soon].map(t=>`<div class="listrow"><b>Tank ${t.id} — ${esc(t.name)}</b><div class="hint">${wcState(t.id)}</div></div>`).join('')||'<p class="hint">No water changes due in the next 2 days.</p>'}<p class="hint">Reminders update when you open the app; they are not phone notifications.</p></div>`}
function renderMaintenance(){return `<div class="panel"><h2>💧 Water change schedules</h2><p class="hint">Default every 7 days. Change any tank independently. Due dates use the last logged water change.</p>${db.tanks.map(t=>`<div class="listrow"><b>Tank ${t.id} — ${esc(t.name)}</b><div class="row"><label for="wc_days_${t.id}">Every (days)</label><input style="max-width:100px" id="wc_days_${t.id}" type="number" min="1" max="365" step="1" value="${wcDays(t.id)}">${btn('Save',`wcSave(${t.id})`,'action')}</div><div class="hint">Last: ${wcLast(t.id)||'Not recorded'} • ${wcState(t.id)}</div></div>`).join('')}</div><div class="panel" style="margin-top:14px"><div class="row"><h2>Maintenance log</h2>${btn('+ Add task',"addForm('maintenance')",'action')}</div>${recordList(db.maintenance,'Maintenance')}</div>`}
function selectTank(id){return `<select id="formTank">${db.tanks.map(t=>`<option value="${t.id}" ${+id===t.id?'selected':''}>Tank ${t.id} – ${esc(t.name)}</option>`).join('')}</select>`}
function addForm(kind,id=1){tab=kind;selected=null;render();let root=document.getElementById('view');let fields=kind==='tests'?`<div class="two">${[['ammonia','Ammonia (ppm)'],['nitrite','Nitrite (ppm)'],['nitrate','Nitrate (ppm)'],['ph','pH'],['highph','High range pH']].map(([k,n])=>`<div><label>${n}</label><input id="f_${k}" type="number" min="0" step="any" placeholder="Optional"></div>`).join('')}</div>`:kind==='breeding'?`<label>Event</label><select id="f_type">${['Eggs laid','Wrigglers','Free swimming fry','Fry count','Successful batch','Unsuccessful batch','Other'].map(s=>`<option>${s}</option>`).join('')}</select>`:`<label>Task</label><select id="f_action">${['Water change','Cleaned tank','Filter maintenance','Fed','Other'].map(s=>`<option>${s}</option>`).join('')}</select>`;
root.insertAdjacentHTML('afterbegin',`<div class="panel" id="entry"><div class="row"><h2>New ${kind==='tests'?'water test':kind==='breeding'?'breeding entry':'maintenance entry'}</h2>${btn('Cancel','render()')}</div><label>Tank</label>${selectTank(id)}<label>Date (leave blank if unknown)</label><input id="f_date" type="date" value="${today()}">${fields}<label>Notes</label><textarea id="f_notes" placeholder="Additional details"></textarea><div class="actions">${btn('Save entry',`submitForm('${kind}')`,'action')}</div></div>`);document.getElementById('entry').scrollIntoView({behavior:'smooth'});}
function submitForm(kind){let item={tank:+document.getElementById('formTank').value,date:document.getElementById('f_date').value,notes:document.getElementById('f_notes').value};if(kind==='tests'){for(let k of ['ammonia','nitrite','nitrate','ph','highph'])item[k]=document.getElementById('f_'+k).value;}else if(kind==='breeding')item.type=document.getElementById('f_type').value;else item.action=document.getElementById('f_action').value;db[kind].push(item);save();render();say('Entry saved for tank '+item.tank+'.')}
function renderCommands(){return `<div class="panel"><h2>🎙️ Voice & typed commands</h2><p class="hint">Speak or type a command. You'll be asked to confirm before any record is saved.</p><label for="commandText">Your instruction</label><textarea id="commandText" placeholder="e.g. Record a water change for tank 6"></textarea><div class="actions"><button class="action" onclick="runTypedCommand()">➤ Process instruction</button><button class="secondary" onclick="voice()">🎙️ Speak instruction</button></div><p class="hint">Examples: “Record a water change for tank 6”, “12 fry counted in tank 8”, “Eggs laid in tank 11”. For other changes, use the tank's normal form.</p><p class="hint">On iPhone, you can also tap the microphone on your keyboard to dictate into the text box. Speech recognition support varies by browser.</p></div>`}
function runTypedCommand(){let s=document.getElementById('commandText')?.value.trim();if(!s){toast('Type an instruction first.');return}interpret(s)}
// Editable room layout; placements are per wall, in percentage coordinates.
const layoutWalls=['left','back','right'];
const defaultPlacements={1:{wall:'left',x:1,y:42,w:23},2:{wall:'left',x:26,y:42,w:23},3:{wall:'left',x:50,y:42,w:23},4:{wall:'left',x:75,y:42,w:23},9:{wall:'left',x:26,y:10,w:23},10:{wall:'left',x:50,y:10,w:23},11:{wall:'left',x:26,y:76,w:15},12:{wall:'left',x:42,y:76,w:15},13:{wall:'left',x:58,y:76,w:15},5:{wall:'back',x:3,y:12,w:23},6:{wall:'back',x:26,y:12,w:23},7:{wall:'back',x:49,y:12,w:23},8:{wall:'back',x:72,y:12,w:23},14:{wall:'back',x:3,y:58,w:92},15:{wall:'right',x:4,y:12,w:44},16:{wall:'right',x:49,y:12,w:44},17:{wall:'right',x:4,y:60,w:44},18:{wall:'right',x:49,y:60,w:44}};
let layoutWall='all',layoutEditing=false,dragLayout=null,layoutSuppressClick=false;
function ensureLayout(){db.layout??={};db.layout.placements??={};db.layout.racks??=[{id:-1,wall:'left',kind:'horizontal',x:1,y:34,length:97},{id:-2,wall:'left',kind:'horizontal',x:1,y:70,length:97},{id:-3,wall:'left',kind:'vertical',x:24,y:36,length:36},{id:-4,wall:'left',kind:'vertical',x:74,y:36,length:36},{id:-5,wall:'back',kind:'horizontal',x:2,y:48,length:95},{id:-6,wall:'back',kind:'vertical',x:2,y:49,length:47},{id:-7,wall:'back',kind:'vertical',x:96,y:49,length:47}];db.layout.dividers??={};db.layout.scale??={};db.layout.rightWaterButt??=true;}
function positionFor(t){ensureLayout();return db.layout.placements[t.id]||defaultPlacements[t.id]||{wall:'right',x:4,y:10,w:40}}
function layoutColor(t){if(t.status!=='active')return '#9aafbb';let d=wcNext(t.id);if(!d)return '#2bbf79';let days=Math.ceil((Date.parse(d+'T12:00:00Z')-Date.parse(today()+'T12:00:00Z'))/86400000);return days<=1?'#ec4848':days<=3?'#efc334':'#2bbf79'}
function layoutWallHTML(w){let racks=db.layout.racks.filter(r=>r.wall===w).map(r=>`<div class="layout-beam ${r.kind==='vertical'?'vertical':''}" style="left:${r.x}%;top:${r.y}%;${r.kind==='vertical'?'height:'+r.length+'%;width:9px':'width:'+r.length+'%;height:9px'}" data-rack="${r.id}" title="Drag to reposition racking"></div>`).join('');let tanks=db.tanks.filter(t=>positionFor(t).wall===w).map(t=>{let a=positionFor(t),n=Number(db.layout.dividers[t.id])||0;return `<button class="layout-tank" style="left:${a.x}%;top:${a.y}%;width:${a.w}%;height:${a.h||21}%;background:${layoutColor(t)}" data-tank="${t.id}" onclick="if(!layoutEditing&&!layoutSuppressClick){go('tanks');openTank(${t.id})}"><b>${t.id}</b>${n?`<span class="layout-dividers" style="background:repeating-linear-gradient(90deg,transparent 0,transparent calc(${100/(n+1)}% - 2px),#153647 calc(${100/(n+1)}% - 2px),#153647 ${100/(n+1)}%)"></span>`:''}${layoutEditing?'<span class="tank-resize-handle" title="Drag to resize">↘</span>':''}</button>`}).join('');return `<div class="panel layout-panel"><h3>${w[0].toUpperCase()+w.slice(1)} wall</h3><div class="layout-canvas ${layoutEditing?'editing':''}" data-wall="${w}" onpointerdown="layoutPointerDown(event)">${racks}${tanks}${w==='right'&&db.layout.rightWaterButt?'<div class="layout-butt">💧<small>Water butt</small></div>':''}</div></div>`}
function renderLayout(){ensureLayout();return `<div class="panel"><h2>🗺️ Fish room — 2D layout</h2><p class="hint">Tap a tank to open its records. Colours: 🟢 more than 3 days, 🟡 2–3 days, 🔴 1 day or less, grey empty.</p><div class="actions">${['all',...layoutWalls].map(w=>btn(w==='all'?'All walls':w[0].toUpperCase()+w.slice(1)+' wall',`setLayoutWall('${w}')`,layoutWall===w?'action':'secondary')).join('')}</div><div class="actions">${btn(layoutEditing?'✓ Finish arranging':'✥ Arrange / drag & drop','toggleLayoutEdit()',layoutEditing?'action':'secondary')}</div>${layoutEditing?`<p class="hint">Drag tanks or rack pieces to reposition; drag a tank’s bottom-right ↘ handle to resize it and recalculate litres. Enter real dimensions once on the Tanks page. Drag between walls when All walls is selected. Tap + Tank or + Beam / Leg to create one, then drag it into place. Drop onto the bin to delete (confirmation required). Use Resize / Dividers for dimensions.</p><div class="actions">${btn('+ Tank','addTankToLayout()','action')}${btn('+ Beam / Leg','addRack()','action')}${btn('Resize / dividers','editLayoutTank()')}${btn('Edit dividers','editDividers()')}</div><div class="layout-trash" id="layout-trash">🗑️ Drop here to delete a tank or rack piece</div>`:''}</div><div class="layout-grid">${(layoutWall==='all'?layoutWalls:[layoutWall]).map(layoutWallHTML).join('')}</div>`}
function toggleLayoutEdit(){layoutEditing=!layoutEditing;render()}
function layoutPointerDown(e){if(!layoutEditing)return;let el=e.target.closest('[data-tank],[data-rack]');if(!el)return;e.preventDefault();let canvas=el.closest('.layout-canvas');let rect=canvas.getBoundingClientRect();let kind=el.hasAttribute('data-tank')?'tank':'rack';let resizing=kind==='tank'&&!!e.target.closest('.tank-resize-handle');let id=Number(el.dataset[kind]);let data=kind==='tank'?positionFor(db.tanks.find(t=>t.id===id)):db.layout.racks.find(r=>r.id===id);if(!data)return;dragLayout={el,canvas,kind,id,wall:canvas.dataset.wall,startX:e.clientX,startY:e.clientY,x:data.x,y:data.y,w:data.w||0,h:data.h||21,resizing,moved:false};el.setPointerCapture(e.pointerId);el.addEventListener('pointermove',layoutPointerMove);el.addEventListener('pointerup',layoutPointerUp);el.addEventListener('pointercancel',layoutPointerCancel)}
function layoutPointerMove(e){let d=dragLayout;if(!d||d.el!==e.currentTarget)return;let r=d.canvas.getBoundingClientRect();let dx=100*(e.clientX-d.startX)/r.width,dy=100*(e.clientY-d.startY)/r.height;if(Math.abs(e.clientX-d.startX)+Math.abs(e.clientY-d.startY)>5)d.moved=true;if(d.resizing){let nw=Math.max(5,Math.min(100-d.x,d.w+dx)),nh=Math.max(8,Math.min(90-d.y,d.h+dy));d.el.style.width=nw+'%';d.el.style.height=nh+'%';return;}let w=d.kind==='tank'?Number(d.el.style.width.replace('%','')):2;d.el.style.left=Math.max(0,Math.min(100-w,d.x+dx))+'%';d.el.style.top=Math.max(0,Math.min(95,d.y+dy))+'%'}
function layoutPointerCancel(e){layoutPointerCleanup(e.currentTarget);render()}
function layoutPointerCleanup(el){el.removeEventListener('pointermove',layoutPointerMove);el.removeEventListener('pointerup',layoutPointerUp);el.removeEventListener('pointercancel',layoutPointerCancel);dragLayout=null}
function layoutPointerUp(e){let d=dragLayout;if(!d||d.el!==e.currentTarget)return;
let trash=document.getElementById('layout-trash'),tr=trash?.getBoundingClientRect();
let deleting=tr&&e.clientX>=tr.left&&e.clientX<=tr.right&&e.clientY>=tr.top&&e.clientY<=tr.bottom;
let target=Array.from(document.querySelectorAll('.layout-canvas')).find(el=>{let r=el.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;});
let x=parseFloat(d.el.style.left),y=parseFloat(d.el.style.top),moved=d.moved;
if(!d.resizing&&target&&target!==d.canvas){let r=target.getBoundingClientRect();let width=d.kind==='tank'?Number(d.el.style.width.replace('%','')):2;x=Math.max(0,Math.min(100-width,100*(e.clientX-r.left)/r.width-width/2));y=Math.max(0,Math.min(95,100*(e.clientY-r.top)/r.height-10));moved=true;}
layoutPointerCleanup(e.currentTarget);
if(deleting&&!d.resizing){if(d.kind==='tank')deleteTank(d.id);else if(confirm('Delete this racking piece?')){db.layout.racks=db.layout.racks.filter(r=>r.id!==d.id);save()}render();return}
if(moved){if(d.kind==='tank'){let t=db.tanks.find(t=>t.id===d.id),a=positionFor(t);if(d.resizing){if(!resizeTankFromLayout(t,parseFloat(d.el.style.width),parseFloat(d.el.style.height))){render();return}}else db.layout.placements[d.id]={...a,wall:target?.dataset.wall||d.wall,x,y}}else{let r=db.layout.racks.find(r=>r.id===d.id);if(r){r.wall=target?.dataset.wall||d.wall;r.x=x;r.y=y}}save();layoutSuppressClick=true;setTimeout(()=>layoutSuppressClick=false,200)}render()}

function setLayoutWall(w){layoutWall=w;render()}
function tankChoice(message){let v=prompt(message+'\nAvailable: '+db.tanks.map(t=>t.id).join(', '));if(v===null)return null;let id=Number(v);if(!db.tanks.some(t=>t.id===id)){toast('Tank not found');return null}return id}
function addTankToLayout(){addTank();if(selected!==null){let id=selected;go('layout');setTankPlacement(id)}}
function editLayoutTank(){let id=tankChoice('Tank number to position or resize:');if(id!==null)setTankPlacement(id)}
function setTankPlacement(id){let a=positionFor(db.tanks.find(t=>t.id===id));let wall=prompt('Wall: left, back or right',a.wall);if(wall===null)return;wall=wall.toLowerCase().trim();if(!layoutWalls.includes(wall)){toast('Choose left, back or right');return}let x=prompt('Horizontal position % (0–95)',a.x);if(x===null)return;let y=prompt('Vertical position % (0–90)',a.y);if(y===null)return;let w=prompt('Tank width % (5–95)',a.w);if(w===null)return;let vals=[x,y,w].map(Number);if(vals.some(n=>!Number.isFinite(n))||vals[0]<0||vals[1]<0||vals[0]>95||vals[1]>90||vals[2]<5||vals[2]>95){toast('Invalid position or width');return}db.layout.placements[id]={wall,x:vals[0],y:vals[1],w:Math.min(vals[2],100-vals[0])};save();go('layout')}
function deleteLayoutTank(){let id=tankChoice('Tank number to delete:');if(id!==null)deleteTank(id)}
function editDividers(){let id=tankChoice('Tank number to change dividers:');if(id===null)return;let v=prompt('Number of internal dividers (0–10)',db.layout.dividers[id]||0);if(v===null)return;let n=Number(v);if(!Number.isInteger(n)||n<0||n>10){toast('Enter 0 to 10');return}db.layout.dividers[id]=n;save();render()}
function addRack(){ensureLayout();let wall=prompt('Wall for new beam or leg: left, back, right',layoutWall==='all'?'left':layoutWall);if(wall===null)return;wall=wall.trim().toLowerCase();if(!layoutWalls.includes(wall)){toast('Invalid wall');return}let kind=prompt('Type: horizontal or vertical','horizontal');if(kind===null)return;kind=kind.trim().toLowerCase();if(!['horizontal','vertical'].includes(kind)){toast('Invalid type');return}let x=prompt('Start position from left (%)','10');if(x===null)return;let y=prompt('Start position from top (%)','50');if(y===null)return;let length=prompt('Length as % of wall','60');if(length===null)return;let a=[x,y,length].map(Number);if(a.some(n=>!Number.isFinite(n)||n<0||n>100)||a[2]===0){toast('Invalid dimensions');return}db.layout.racks.push({id:Date.now()+Math.floor(Math.random()*10000),wall,kind,x:a[0],y:a[1],length:Math.min(a[2],100-(kind==='horizontal'?a[0]:a[1]))});save();render()}
function editRack(id){let r=db.layout.racks.find(x=>x.id===id);if(!r)return;let choice=prompt('Racking '+r.kind+' on '+r.wall+' wall. Enter MOVE or DELETE','MOVE');if(!choice)return;if(choice.toUpperCase()==='DELETE'){if(confirm('Remove this beam or leg?')){db.layout.racks=db.layout.racks.filter(x=>x.id!==id);save();render()}return}if(choice.toUpperCase()!=='MOVE')return;let x=prompt('Left position (%)',r.x),y=x===null?null:prompt('Top position (%)',r.y),length=y===null?null:prompt('Length (%)',r.length);if(length===null)return;let a=[x,y,length].map(Number);if(a.some(n=>!Number.isFinite(n)||n<0||n>100)||a[2]===0){toast('Invalid dimensions');return}[r.x,r.y,r.length]=a;save();render()}
function removeRack(){if(!db.layout.racks.length){toast('No added racking to remove');return}let rows=db.layout.racks.map((r,i)=>`${i+1}: ${r.wall} ${r.kind}`).join('\n');let n=Number(prompt('Which racking piece?\n'+rows));if(n>=1&&n<=db.layout.racks.length)editRack(db.layout.racks[n-1].id)}
function moveRack(){removeRack()}
function renderSettings(){let r=db.reservoir;return `<div class="panel"><h2>Voice preferences</h2><label style="display:flex;align-items:center;gap:10px;font-size:15px"><input style="width:20px;height:20px" type="checkbox" id="reply" ${db.settings.voiceReply?'checked':''} onchange="db.settings.voiceReply=this.checked;save()">Speak responses aloud</label><p class="hint">Tap 🎙️ to dictate. Voice recognition depends on the browser/device and may not work when this file is opened locally. You can always type.</p></div><div class="panel" style="margin-top:12px"><h2>Water butt</h2><p>Approx. ${r.capacity} L maximum • ${r.volume} L current estimate</p><p class="hint">${esc(r.notes)}</p><label>Current water depth (mm)</label><input id="depth" type="number" value="${r.level}"><div class="actions">${btn('Update level','updateLevel()','action')}</div></div><div class="panel" style="margin-top:12px"><h2>☁️ Online saving</h2><div id='cloud-panel'>${cloudPanel()}</div></div><div class="panel" style="margin-top:12px"><h2>Backups and data</h2><p class="hint">Local records remain on this device. Online saving is optional until you explicitly activate it. Keep a separate backup until cloud saving is verified.</p><div class="actions">${btn('⬇ Export backup','exportBackup()','action')}<label class="secondary" style="margin:0;cursor:pointer">⬆ Restore backup <input style="display:none" type="file" accept="application/json,.json" onchange="importBackup(event)"></label></div><p class="hint">To move devices: export a JSON backup and restore it on the other device. Keep backup files somewhere safe such as iCloud Drive.</p></div>`}
function updateLevel(){let d=+document.getElementById('depth').value,r=db.reservoir;r.level=Math.max(0,Math.min(r.height,d));r.volume=Math.round(r.capacity*r.level/r.height);save();render();say('Estimated water volume '+r.volume+' litres.')}
function exportBackup(){let blob=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='fishroom-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Backup created. Save it somewhere safe.')}
async function importBackup(e){let f=e.target.files?.[0];if(!f)return;try{let val=JSON.parse(await f.text());if(!Array.isArray(val.tanks)||!Array.isArray(val.tests)||!Array.isArray(val.breeding)||!Array.isArray(val.maintenance))throw Error('Invalid backup');if(!confirm('Replace current app records with this backup?'))return;db=val;db.settings??={voiceReply:true};db.reservoir??=initial().reservoir;if(!Array.isArray(db.stockItems))db.stockItems=stockDefaults.map(([name,price])=>({name,price,qty:0}));db.tanks.forEach(t=>{t.saleCounts??={};});save();go('tanks');say('Backup restored.')}catch(err){toast('Could not restore: '+err.message)}}

let cloudEnabled=false,cloudTimer=null,cloudBusy=false,cloudDirty=false,cloudSession=null,cloudConfig=null,cloudStatus='Not connected';
const cloudKey='fishroom_cloud_config_v1';
try{cloudConfig=JSON.parse(localStorage.getItem(cloudKey)||'null')}catch{}
function cloudPanel(){return `<p><b>Status:</b> ${esc(cloudStatus)}</p><p class="hint">Cloud saving stays OFF until you explicitly upload your current records. This prevents an incomplete backup from replacing your data.</p><label>Supabase Project URL</label><input id="sburl" placeholder="https://your-project.supabase.co" value="${esc(cloudConfig?.url||'https://mndkcjupllqevtlaeyyr.supabase.co')}"><label>Publishable key</label><input id="sbkey" value="${esc(cloudConfig?.key||'sb_publishable_Ut-foEeTSp4iaNtOfWQVWA_XEhlk1tf')}"><label>Email</label><input id="sbemail" type="email" autocomplete="username"><label>Password</label><input id="sbpassword" type="password" autocomplete="current-password"><div class="actions">${btn('Sign in','cloudLogin()','action')}${btn('Upload CURRENT records','cloudFirstUpload()')}${btn('Load cloud records','cloudLoad()')}${btn('Disconnect','cloudDisconnect()')}</div><p class="hint">Sign in first. Upload CURRENT records only after checking your counts. Loading from cloud requires confirmation and creates a local safety snapshot. Never enter a secret/service-role key.</p>`}
function cloudRefresh(){let e=document.getElementById('cloud-panel');if(e)e.innerHTML=cloudPanel()}
function cloudHeaders(extra={}){return {'apikey':cloudConfig.key,'Authorization':'Bearer '+cloudSession.access_token,'Content-Type':'application/json',...extra}}
async function cloudRequest(path,opts={}){let r=await fetch(cloudConfig.url+path,opts),raw=await r.text(),v;try{v=raw?JSON.parse(raw):null}catch{v=raw}if(!r.ok)throw Error(typeof v==='object'?(v.message||v.error_description||v.error||r.status):String(v));return v}
async function cloudLogin(){try{let url=document.getElementById('sburl').value.trim().replace(/\/$/,'');let key=document.getElementById('sbkey').value.trim(),email=document.getElementById('sbemail').value.trim(),password=document.getElementById('sbpassword').value;if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(url)||!key.startsWith('sb_publishable_'))throw Error('Enter your Supabase Project URL and publishable key.');cloudConfig={url,key};localStorage.setItem(cloudKey,JSON.stringify(cloudConfig));let res=await cloudRequest('/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':key,'Content-Type':'application/json'},body:JSON.stringify({email,password})});cloudSession=res;cloudStatus='Signed in — online saving OFF until initial upload';cloudRefresh();toast('Signed in. Check records, then upload CURRENT records.')}catch(e){cloudStatus='Sign-in failed';cloudRefresh();alert(e.message)}}
async function cloudFirstUpload(){if(!cloudSession){toast('Sign in first');return}if(!confirm('Upload the records CURRENTLY visible in this browser to your private cloud table? Check stock counts and maintenance first. This does not erase local records.'))return;try{await cloudPush();cloudEnabled=true;cloudStatus='Saved online — automatic saving ON';cloudRefresh();toast('Current records uploaded; automatic saving ON')}catch(e){cloudStatus='Upload failed — local records safe';cloudRefresh();alert(e.message)}}
async function cloudPush(){if(cloudSession&&Date.now()/1000>=(cloudSession.expires_at||0)-90&&cloudSession.refresh_token){let r=await cloudRequest('/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':cloudConfig.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:cloudSession.refresh_token})});cloudSession=r;}if(cloudBusy){cloudDirty=true;return}cloudBusy=true;let snapshot=JSON.stringify(db);try{await cloudRequest('/rest/v1/fishroom_data?on_conflict=user_id',{method:'POST',headers:cloudHeaders({'Prefer':'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify({user_id:cloudSession.user.id,data:JSON.parse(snapshot),updated_at:new Date().toISOString()})});cloudStatus='Saved online at '+new Date().toLocaleTimeString();}finally{cloudBusy=false;if(cloudDirty&&cloudEnabled){cloudDirty=false;queueCloudSave()}cloudRefresh()}}
function queueCloudSave(){if(!cloudEnabled||!cloudSession)return;cloudStatus='Saving…';clearTimeout(cloudTimer);cloudTimer=setTimeout(async()=>{try{await cloudPush()}catch(e){cloudStatus='Offline / unsaved online — local copy safe';cloudRefresh()}},900)}
async function cloudLoad(){if(!cloudSession){toast('Sign in first');return}try{let rows=await cloudRequest('/rest/v1/fishroom_data?select=data,updated_at&user_id=eq.'+encodeURIComponent(cloudSession.user.id),{headers:cloudHeaders()});if(!rows.length){toast('No cloud data yet');return}let val=rows[0].data;if(!Array.isArray(val?.tanks))throw Error('Invalid cloud data');if(!confirm('Replace the records shown in THIS browser with cloud records from '+rows[0].updated_at+'? A local safety snapshot will be kept.'))return;localStorage.setItem('fishroom_before_cloud_restore_'+Date.now(),JSON.stringify(db));db=val;db.settings??={voiceReply:true};db.tanks.forEach(t=>t.saleCounts??={});localStorage.setItem(KEY,JSON.stringify(db));cloudEnabled=true;cloudStatus='Cloud records loaded — automatic saving ON';go('dashboard');toast('Cloud records loaded; previous local snapshot preserved')}catch(e){alert(e.message)}}
function cloudDisconnect(){cloudEnabled=false;cloudSession=null;cloudStatus='Disconnected — local saving only';cloudRefresh()}
function quickRecord(type){let id=Number(prompt('Tank number?'));if(!db.tanks.some(t=>t.id===id))return toast('Unknown tank');let note=prompt('Optional notes?')||'';if(type==='water'){db.maintenance.push({tank:id,date:today(),action:'Water change',notes:note})}else if(type==='eggs'){db.breeding.push({tank:id,date:today(),type:'Eggs laid',notes:note})}else{db.maintenance.push({tank:id,date:today(),action:'Feeding',notes:note})}save();render();toast('Recorded for tank '+id)}
function renderDashboard(){let active=db.tanks.filter(t=>t.status==='active'),due=active.filter(t=>wcNext(t.id)&&wcNext(t.id)<=today()),unknown=active.filter(t=>!wcLast(t.id)),total=db.stockItems.reduce((a,x)=>a+saleCount(x.name)*(Number(x.price)||0),0);return `<div class="panel"><h2>📊 Fish Room dashboard</h2><div class="metrics"><div class="metric"><b>${active.length}</b><span>Active tanks</span></div><div class="metric"><b>${due.length}</b><span>Water changes due</span></div><div class="metric"><b>£${total.toFixed(2)}</b><span>Saleable stock</span></div></div><h3>Quick actions</h3><div class="actions">${btn('💧 Water change',"quickRecord('water')",'action')}${btn('🥚 Eggs laid',"quickRecord('eggs')")}${btn('🍽️ Feeding',"quickRecord('feed')")}</div><h3>Water-change reminders</h3><p>${due.map(t=>'Tank '+t.id).join(', ')||'None currently overdue'} ${unknown.length?' • No recorded change: '+unknown.map(t=>t.id).join(', '):''}</p><h3>Recent activity</h3>${[...db.maintenance.map(x=>({...x,kind:'Maintenance'})),...db.breeding.map(x=>({...x,kind:'Breeding'}))].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,8).map(x=>`<div class="listrow">${esc(x.date||'Date unknown')} · Tank ${esc(x.tank)} · ${esc(x.action||x.type)}</div>`).join('')||'<p>No activity yet</p>'}</div>`}
function fryAgePanel(){let items=db.breeding.filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x.date||'')&&/hatch|wriggler|free.swim/i.test(x.type||''));return `<div class="panel"><h3>🐟 Automatic fry age</h3><p class="hint">Calculated from recorded hatch/wriggler dates; these are not necessarily identical biological milestones.</p>${items.map(x=>{let days=Math.floor((Date.parse(today()+'T12:00:00Z')-Date.parse(x.date+'T12:00:00Z'))/86400000);return `<div class="listrow">Tank ${esc(x.tank)} · ${esc(x.type)}: ${days} days (${Math.floor(days/7)} weeks ${days%7} days)</div>`}).join('')||'<p>Record a hatch or wriggler date to calculate age.</p>'}</div>`}
function breedingStats(){let groups={};for(let x of db.breeding){(groups[x.tank]??=[]).push(x)}return `<div class="panel"><h3>Breeding history by tank</h3>${Object.entries(groups).map(([id,rows])=>`<div class="listrow">Tank ${esc(id)} · ${rows.length} events · ${rows.filter(x=>/eggs laid/i.test(x.type)).length} recorded spawns</div>`).join('')}</div>`}
function waterWarnings(){let latest={};for(let x of db.tests){if(!latest[x.tank]||(x.date||'')>=(latest[x.tank].date||''))latest[x.tank]=x}return `<div class="panel"><h3>⚠️ Latest water-test alerts</h3><p class="hint">Any detectable ammonia or nitrite is flagged. Values are informational, not a diagnosis; verify readings and assess fish behaviour.</p>${Object.entries(latest).map(([id,x])=>{let warnings=[];if(Number(x.ammonia)>0)warnings.push('Ammonia '+x.ammonia+' ppm');if(Number(x.nitrite)>0)warnings.push('Nitrite '+x.nitrite+' ppm');return `<div class="listrow">Tank ${esc(id)}: ${warnings.length?'⚠️ '+esc(warnings.join(' · ')):'No ammonia/nitrite alert'} (${esc(x.date||'undated')})</div>`}).join('')||'<p>No water tests recorded.</p>'}</div>`}
function renderEquipment(){db.equipment??=[];return `<div class="panel"><h2>🔧 Equipment tracker</h2>${btn('+ Add equipment','addEquipment()','action')}${db.equipment.map((x,i)=>`<div class="listrow"><b>${esc(x.name)}</b> · Tank ${esc(x.tank)}<p>${esc(x.notes)} · ${esc(x.date)}</p>${btn('Remove',`removeEquipment(${i})`)}</div>`).join('')||'<p>No equipment recorded yet.</p>'}</div>`}
function addEquipment(){let tank=Number(prompt('Tank number?')),name=prompt('Equipment name (heater, filter, pump etc.)?');if(!name||!db.tanks.some(t=>t.id===tank))return;let notes=prompt('Notes / cleaning or replacement details?')||'';db.equipment??=[];db.equipment.push({tank,name,notes,date:today()});save();render()}

saveTank=function(){let t=db.tanks.find(x=>x.id===selected),old=tankDims(t),g=wholeFor(t.id),before=g?g.ids.map(id=>tankDims(db.tanks.find(x=>x.id===id))):null;_saveTankOriginal();if(!g||!old)return;let next=tankDims(t);if(!next)return;let priorWidth=before.reduce((a,d)=>a+(d?.[0]||0),0),newWidth=g.ids.reduce((a,id)=>a+(tankDims(db.tanks.find(x=>x.id===id))?.[0]||0),0);if(priorWidth>0)g.w=Math.max(8,Math.min(100-g.x,g.w*newWidth/priorWidth));if(old[2]>0)g.h=Math.max(9,Math.min(100-g.y,g.h*next[2]/old[2]));save();render()};
